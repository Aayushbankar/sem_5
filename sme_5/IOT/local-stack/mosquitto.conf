listener 1883 127.0.0.1
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true

# Bridge cit2026/# to the public broker so Cirkit/Wokwi cloud sims
# appear on this local broker (cloud sims cannot reach localhost).
connection emqx-bridge
address broker.emqx.io:1883
topic cit2026/# both 1
remote_clientid sme5-local-bridge
try_private true
start_type automatic
notifications false
