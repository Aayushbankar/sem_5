site_name: Semester 5 — GTU IT Study Kit 🎓
site_url: https://aayushbankar.github.io/sem_5/
site_description: 'Complete gold-standard study kit for Semester 5 GTU Diploma IT: notes, solved practicals, PYQs.'
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - navigation.footer
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
repo_url: https://github.com/Aayushbankar/sem_5
repo_name: Aayushbankar/sem_5
copyright: © 2026 · Made for GTU Diploma IT — Semester 5 · <em>Consistency is the key to success.</em>
plugins:
- search
markdown_extensions:
- tables
- attr_list
- md_in_html
- admonition
- footnotes
- toc:
    permalink: true
    toc_depth: 2
- pymdownx.details
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.tasklist:
    custom_checkbox: true
    clickable_checkbox: true
- pymdownx.emoji
extra_javascript:
- https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js
- javascripts/study-progress.js
extra_css:
- stylesheets/extra.css
exclude_docs: |
  /pyq/cc/
